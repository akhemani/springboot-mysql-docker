version: "3.8"

networks:
  appnet:

volumes:
  mysql_data:

services:
  db:
    image: mysql:8.0.36
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u${DB_USER} -p${DB_PASS} || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    networks:
      - appnet
    restart: unless-stopped
    # IMPORTANT: no ports published → DB not exposed to host

  app:
    build: .
    image: visit-tracker:2.0.0
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8081:8081"    # expose app only
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/actuator/health/readiness | grep -q '\"status\":\"UP\"'"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp
    user: "10001:10001"
    networks:
      - appnet
    restart: unless-stopped
